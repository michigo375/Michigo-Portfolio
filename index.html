<!DOCTYPE html>
<html lang="zh-Hant">




<head>
  <link rel="stylesheet" href="style.css">
  <!-- 瀏覽器分頁圖示 -->
 <link rel="icon" type="image/png" href="images/denpaicon_64x64.png">

<!-- iPhone 加入主畫面時的圖示 -->
<link rel="apple-touch-icon" href="images/denpaicon_180x180.png">
 
  <link rel="stylesheet" href="style.css" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電波信号観測所</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
</head>
<body>
  <h1>電波信号観測中</h1>
  <p>2025.7.13</p>
<body>
  <img src="images/denpasingo.png" alt="search" width="200" />
  

<!-- 按鈕區塊 -->
<p>放電 <span id="clickCount">0</span> times</p>
<button id="countButton">⚡</button>


<script>
  // 計數變數
  let count = 0;

  // 抓到按鈕與文字元素
  const button = document.getElementById("countButton");
  const display = document.getElementById("clickCount");

  // 點擊時的動作
  button.addEventListener("click", function () {
    count++;
    display.textContent = count;
  });
</script>
<script type="module" src="./firebase.js"></script>

<section id="guestbook">
  <h2>COMMENTS</h2>

  <input id="nickname" type="text" placeholder="暱稱（留白則匿名）" maxlength="30">
  <textarea id="message" placeholder="言葉は電波。何を伝えたいのか。" maxlength="1000"></textarea>
  <button id="sendMessage">電波発信する</button>

  <p id="status"></p>
  <div id="messages"></div>
  
<div id="pagination">
  <button id="prevPage" disabled>Prev</button>
  <span id="pageInfo"> 1 </span>
  <button id="nextPage" disabled>Next</button>
</div>

  <!-- 留言板注意事項遮罩 -->
  <div id="guestbook-notice-overlay">
    <div id="guestbook-notice" role="dialog" aria-modal="true" aria-labelledby="guestbook-notice-title">
      <button id="guestbook-notice-close" type="button" aria-label="關閉">×</button>

      <h3 id="guestbook-notice-title">NOTICE</h3>
      <p>留言前請確認以下事項：</p>
      <ul>
        <li>請勿發布個人隱私資訊。</li>
        <li>請勿發布違法或不當內容。</li>
        <li>請尊重其他留言者。</li>
      </ul>

      <button id="guestbook-notice-confirm" type="button">確認</button>
    </div>
  </div>
</section>

</section>

<script type="module" src="./guestbook.js"></script>

</body>
</html>
