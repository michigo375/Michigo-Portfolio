<!DOCTYPE html>
<html lang="zh-Hant">

<style>
  #messages {
    max-height: 400px;
    overflow-y: auto;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
  }

  #messages article {
    overflow-wrap: anywhere;
    padding: 10px 0;
    border-bottom: 1px solid #ddd;
  }

  #messages article:last-child {
    border-bottom: none;
  }

  
/* 留言板整體 */
#guestbook {
  background: #ffffff;
  color: #222222;
  max-width: 720px;
  margin: 24px auto;
  padding: 20px;
  border-radius: 12px;
  box-sizing: border-box;
}

/* 暱稱、留言框、按鈕統一寬度 */
#guestbook input,
#guestbook textarea,
#guestbook button {
  display: block;
  width: 100%;
  box-sizing: border-box;
  margin: 0 0 12px;
  padding: 12px;
  font: inherit;
  border-radius: 6px;
}

/* 輸入框 */
#guestbook input,
#guestbook textarea {
  border: 1px solid #cccccc;
  background: #ffffff;
  color: #222222;
}

/* 留言輸入區 */
#guestbook textarea {
  min-height: 120px;
  resize: vertical;
}

/* 送出按鈕 */
#guestbook button {
  cursor: pointer;
}

/* 留言列表維持白底及內部捲動 */
#messages {
  background: #ffffff;
  color: #222222;
  max-height: 400px;
  overflow-y: auto;
  overflow-wrap: anywhere;
}

/* 留言板文字靠左 */
#guestbook,
#messages article {
  text-align: left;
}

/* 留言時間放在右下角 */
#messages .message-time {
  text-align: right;
  font-size: 12px;
  color: #888888;
  margin-top: 8px;
}
</style>

<!-- 按鈕區塊 -->
<p>放電 <span id="clickCount">0</span> times</p>
<button id="countButton">⚡</button>


<script>
  // 計數變數
  let count = 0;

  // 抓到按鈕與文字元素
  const button = document.getElementById("countButton");
  const display = document.getElementById("clickCount");

  // 點擊時的動作
  button.addEventListener("click", function () {
    count++;
    display.textContent = count;
  });
</script>
<script type="module" src="./firebase.js"></script>

<section id="guestbook">
  <h2>COMMENTS</h2>

  <input id="nickname" type="text" placeholder="暱稱（留白則匿名）" maxlength="30">

  <button id="sendMessage">電波発信する</button>

<div id="pagination">
